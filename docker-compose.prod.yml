version: '3.8'

services:
  backend:
    image: erez3535/cob-auto-certificates:v2
    container_name: certificate-backend
    expose:
      - "8000"
    environment:
      - DEBUG=False

      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_RESULTS_EMAIL=${ADMIN_RESULTS_EMAIL}

      # Paths
      - TEMPLATE_PATH=/app/data/template.png
      - FIELDS_CONFIG_PATH=/app/fields_config.json
      - FONTS_DIR=/app/fonts

      # Logging
      - LOG_LEVEL=INFO

      # Your single source of truth
      - FRONTEND_URL=${FRONTEND_URL}

      # CORS dynamically uses frontend URL
      - CORS_ORIGINS=${FRONTEND_URL}

    restart: unless-stopped


  nginx:
    image: nginx:alpine
    container_name: certificate-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
