version: '3.8'

services:
  backend:
    image: erez3535/cob-auto-certificates:v3
    container_name: certificate-backend
    expose:
      - "8000"
    environment:
      - DEBUG=False

      # SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_RESULTS_EMAIL=${ADMIN_RESULTS_EMAIL}

      # Paths
      - TEMPLATE_PATH=/app/data/template.png
      - FIELDS_CONFIG_PATH=/app/fields_config.json
      - FONTS_DIR=/app/fonts

      # Logging
      - LOG_LEVEL=INFO

      # ============================================
      # SINGLE SOURCE OF TRUTH (SSOT) - FRONTEND URL
      # ============================================
      # Define FRONTEND_URL here - it will be used for:
      # 1. CORS configuration (automatically)
      # 2. /health endpoint response
      # 3. All backend references to frontend
      # ============================================
      - FRONTEND_URL=${FRONTEND_URL:-https://jabanes.github.io/Auto-Certificate-Frontend/}
      
      # CORS_ORIGINS is automatically derived from FRONTEND_URL (SSOT)
      # Only set CORS_ORIGINS if you need multiple origins (comma-separated)
      # Otherwise, leave it unset and it will use FRONTEND_URL

    restart: unless-stopped


  nginx:
    image: nginx:alpine
    container_name: certificate-nginx
    ports:
      - "80:80"
      - "443:443"  # HTTPS port (uncomment after SSL setup)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment after SSL certificate setup:
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
