events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Backend API proxy
    upstream backend {
        server backend:8000;
    }

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name auto-certificates.ozerli.co.il;
    return 301 https://$host$request_uri;
}

# HTTPS API
server {
    listen 443 ssl http2;
    server_name auto-certificates.ozerli.co.il;

    ssl_certificate     /etc/letsencrypt/live/auto-certificates.ozerli.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto-certificates.ozerli.co.il/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /generate-certificates-excel {
        proxy_pass http://backend/generate-certificates-excel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
    }

    location /generate-certificates-excel-dev {
        proxy_pass http://backend/generate-certificates-excel-dev;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
    }

    location /generate-certificates-batch {
        proxy_pass http://backend/generate-certificates-batch;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
    }

    location /distribute-certificates {
        proxy_pass http://backend/distribute-certificates;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /send-certificates {
        proxy_pass http://backend/send-certificates;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /template {
        proxy_pass http://backend/template;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10M;
    }

    location /health {
        proxy_pass http://backend/health;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /docs {
        proxy_pass http://backend/docs;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

}
