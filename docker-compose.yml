version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certificate-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      # SMTP Configuration (for sending to students)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - EMAIL_FROM=${EMAIL_FROM}
      # Admin receiver for ZIP results
      - ADMIN_RESULTS_EMAIL=${ADMIN_RESULTS_EMAIL}
      # General settings
      - TEMPLATE_PATH=${TEMPLATE_PATH:-/app/data/template.png}
      - FIELDS_CONFIG_PATH=${FIELDS_CONFIG_PATH:-/app/fields_config.json}
      - FONTS_DIR=${FONTS_DIR:-/app/fonts}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://jabanes.github.io}
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: certificate-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

