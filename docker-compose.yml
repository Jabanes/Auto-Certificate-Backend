version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certificate-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_RESULTS_EMAIL=${ADMIN_RESULTS_EMAIL}

      - TEMPLATE_PATH=/app/data/template.png
      - FIELDS_CONFIG_PATH=/app/fields_config.json
      - FONTS_DIR=/app/fonts

      - LOG_LEVEL=INFO

      # ============================================
      # SINGLE SOURCE OF TRUTH (SSOT) - FRONTEND URL
      # ============================================
      # Define FRONTEND_URL here - it will be used for:
      # 1. CORS configuration (automatically)
      # 2. /health endpoint response
      # 3. All backend references to frontend
      # ============================================
      # Development: Use localhost (Live Server)
      # Production: Use GitHub Pages URL
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5501}
      
      # CORS_ORIGINS is automatically derived from FRONTEND_URL (SSOT)
      # For development, you may want multiple origins (localhost:5500, 5501, 127.0.0.1)
      # Set CORS_ORIGINS explicitly if needed, otherwise it uses FRONTEND_URL
      - CORS_ORIGINS=${CORS_ORIGINS:-}

    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs

    restart: always
